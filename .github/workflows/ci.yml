name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ProductionReadyApi.sln

      - name: Build
        run: dotnet build ProductionReadyApi.sln --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test ProductionReadyApi.sln --configuration Release --no-build --coverlet --coverlet-output-format cobertura --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
