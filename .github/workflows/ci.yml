name: CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ProductionReadyApi.sln

      - name: Build
        run: >
          dotnet build ProductionReadyApi.sln
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test ProductionReadyApi.sln
          --configuration Release
          --no-build
          --logger "trx"
          --results-directory ./TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: >
          docker build
          --file src/ProductionReadyApi.Api/Dockerfile
          --tag production-ready-api:${{ github.sha }}
          .